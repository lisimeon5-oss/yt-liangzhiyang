<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <script>
            // Capture only the destination before the SDK/router rewrites the launch URL.
            (function () {
                function read(value) {
                    var text = (value || '').replace(/^[?#]/, '');
                    if (text.charAt(0) === '/') text = text.slice(text.indexOf('?') + 1);
                    var params = new URLSearchParams(text);
                    return params.get('tgWebAppStartParam') || new URLSearchParams(params.get('tgWebAppData') || '').get('start_param') || '';
                }
                var payload = read(window.location.search) || read(window.location.hash);
                if (/^(bargain_[1-9]\d*|group_[1-9]\d{0,9}_[1-9]\d{0,9}_[1-9]\d{0,9})$/.test(payload)) window.__mallTelegramStart = payload;
            })();
        </script>
        <!-- ⭐ 换用官方 Telegram CDN -->
        <script src="https://telegram.org/js/telegram-web-app.js">
        </script>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
				<!-- <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"> -->
        <title>
            <%= htmlWebpackPlugin.options.title %>
        </title>
        <!-- Open Graph data -->
        <!-- <meta property="og:title" content="Title Here" /> -->
        <!-- <meta property="og:url" content="http://www.example.com/" /> -->
        <!-- <meta property="og:image" content="http://example.com/image.jpg" /> -->
        <!-- <meta property="og:description" content="Description Here" /> -->
        <script>
            var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
            document.write('<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' + (coverSupport ? ', viewport-fit=cover' : '') + '" />')
						if(window.location.protocol == 'https:'){
							document.write('<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">')
						}
        </script>
        <link rel="stylesheet" href="<%= BASE_URL %>static/index.<%= VUE_APP_INDEX_CSS_HASH %>.css" />
	</head>
    <body>
        <noscript>
            <strong>Please enable JavaScript to continue.</strong>
        </noscript>
        <div id="app"></div>
        <!-- built files will be auto injected -->
    </body>
</html>
